[package]
name = "signer_manager_module"
version = "0.1.0"
edition = "2021"
description = "Logos signer manager: takes signature requests, shows them, and has each account's signer sign. Holds no keys."
# The module builder's rustc; resolver 3 keeps the lock within it.
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
# staticlib for the Qt plugin; rlib so cargo test builds the core without the Logos runtime.
crate-type = ["staticlib", "rlib"]

[dependencies]
# EVM: transactions, EIP-191 and EIP-712 hashing, signed envelopes. No signer, no network.
alloy = { version = "1", default-features = false, features = ["std", "consensus", "eips", "rlp", "dyn-abi", "eip712"] }
# Bitcoin: PSBTs, sighashes, keys below an account's xpub. The plugin's export list keeps libsecp256k1 in.
bitcoin = { version = "0.32.102", default-features = false, features = ["std", "base64"] }
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "d2f95e01b8c2aa1c1e1ed2c7cf18e7963a685d02" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"

# Staged by the builder as a sibling crate; optional so cargo test builds the core without it.
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[dev-dependencies]
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "d2f95e01b8c2aa1c1e1ed2c7cf18e7963a685d02", features = ["mock", "conformance"] }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
alloy = { version = "1", default-features = false, features = ["std", "consensus", "eips", "signers", "signer-local"] }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
