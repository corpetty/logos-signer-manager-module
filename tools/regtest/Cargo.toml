[package]
name = "signer-manager-regtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Signs BDK-built PSBTs through signer_manager_module and broadcasts them to a regtest bitcoind."

# Its own workspace and lock, so BDK never enters the module's build.
[workspace]
resolver = "3"

[dependencies]
signer_manager_module = { path = "../../rust-lib", default-features = false }
# The signer: the interface's mock, keyed from the keystore harness's test phrase.
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "d2f95e01b8c2aa1c1e1ed2c7cf18e7963a685d02", features = ["mock"] }
bdk_wallet = "3.2.0"
ureq = { version = "2", default-features = false }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
